# mise configuration for all-skills
# https://mise.jdx.dev/configuration.html

[env]
# `.mise/scripts` off PATH, as in the parent -- and here it is unambiguous: that
# directory contains NOTHING BUT the two retired scripts.
_.path = ["agents/hermes/pm"]
_.file = [".env"]

#
# NOTE: every managed script is handed config_root EXPLICITLY. A mise enter
# hook runs with cwd set to the directory you cd'd into -- including a PARENT
# config's hook -- so a script that reads its subject from cwd reshapes
# whichever nested repo you entered. config_root locates the file; the
# argument locates the subject. The scripts refuse to run without it.
#
# NOTE: hooks are an array of [[hooks.enter]] tables (NOT enter = [ ... ]) and
# every {{config_root}} path is single-quoted so it survives a space in the
# project path — mise runs each `script` via `sh -c`.

# This block will handle the linking of
# agent files to the main AGENTS.md file.
#
# TODO: Ensure this works for all levels of nesting.
# i.e. All linked agent files MUST be siblings at
# any given level of nesting.
[[hooks.enter]]
script = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"
# NOTE: there is deliberately no skills enter hook -- retired here for the same
# reason as in the parent config (~/code/skillex/mise.toml).
#
# mise loads BOTH configs when cwd is under this directory (`mise config ls`
# confirms it), so retiring the hooks in the parent did not retire them here:
# `cd all-skills` still ran provision-packs.py and then sync-skills.py against
# this tree on every entry. That is the worst place left on the machine for them
# to run unattended -- this directory IS the skills SSoT (skillex.toml
# [skillex].skills_root), so a projector rebuilding it is rewriting the catalog
# every other surface resolves through.
#
# sync-skills.py also has no full dry-run: its only preview, --reconcile-dry-run,
# "Suppresses deletions only: links are still created and relinked." There was no
# way to observe what an entry hook had just done to this tree.
#
# `skillex sync` is a command you run, not a thing that happens to you.
[[hooks.enter]]
# Atomic (PJAN-24/PJAN-57): shell complexity lives in the managed script so
# mise never interpolates temporary variables. The script uses mktemp, traps
# cleanup, and replaces .env only after op inject succeeds.
script = "'{{config_root}}/.mise/scripts/materialize-env.sh'"
[[hooks.enter]]
script = "[ -f '{{config_root}}/.mise/scripts/codegraph.sh' ] && '{{config_root}}/.mise/scripts/codegraph.sh' || true"

[tasks."hindsight:setup"]
description = "Provision this dev's shared project Hindsight key from 1Password into .env (op read; upserts those two keys, leaves the rest of .env intact)"
run = "'{{config_root}}/.mise/scripts/hindsight-setup.sh'"

[[watch_files]]
patterns = ["AGENTS.md"]
task = "link:agentfiles"

[tasks."link:agentfiles"]
description = "Symlink all agent files to AGENTS.md"
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"

# NOTE: there is deliberately no skills task here AT ALL -- not even a repointed
# one -- and the reason is stronger than "the engine was retired".
#
# This directory IS the catalog. An activation root inside it is a thing skillex
# structurally refuses; `skillex sync --scope project --project <all-skills>`
# answers:
#
#   error E_ROOT_INSIDE_REGISTRY: .../all-skills/.agents/skills lies inside the
#   registry's all-skills/
#       The registry is a source, never an activation target.
#
# So the two tasks that used to live here could not be migrated, only removed.
# What they had been doing was worse than a no-op: `[[watch_files]]` fired
# skills:sync on every save of .agents/skills.json, which ran sync-skills.py --
# an engine with no sets[] support -- against the SSoT catalog, unattended.
# Retiring the parent's [[hooks.enter]] did not stop it, because a watch_files
# trigger is a separate surface from an enter hook.
#
# all-skills/.agents/skills.json is kept because it is tracked and harmless, but
# nothing reads it: it can never be projected from here.
