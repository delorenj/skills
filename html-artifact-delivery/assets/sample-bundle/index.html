<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML artifact delivery check</title>
  <link rel="icon" href="assets/img/badge.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="card">
    <img id="badge" src="assets/img/badge.svg" alt="Delivery badge" width="96" height="96">
    <h1>HTML artifact delivery check</h1>
    <ul>
      <li>CSS: <span id="css-status" class="status">styles not loaded</span></li>
      <li>Image: <span id="img-status" class="status">waiting</span></li>
      <li>JavaScript: <span id="js-status" class="status">script not run</span></li>
    </ul>
  </main>
  <script src="assets/js/app.js"></script>
</body>
</html>
